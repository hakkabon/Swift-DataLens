name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  build-test-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat (check)
        run: |
          brew install swiftformat || true
          swiftformat --lint Sources Tests || true
      - name: SwiftLint (check)
        run: |
          brew install swiftlint || true
          swiftlint lint --strict || true
